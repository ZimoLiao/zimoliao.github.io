adius:8px;background:var(--global-code-bg-color)}.gallery-media video{display:block;width:100%;aspect-ratio:3 / 1;object-fit:contain;background:#fff}.gallery-media--45x16 video{aspect-ratio:45 / 16}.gallery-caption{margin-top:.75rem;color:var(--global-text-color-light);font-family:Georgia,"Times New Roman",serif;font-size:.92rem;line-height:1.55;letter-spacing:0}.gallery-caption mjx-container[jax="CHTML"]{margin:0 .03em;font-size:1em!important}.gallery-caption .math{color:inherit}.gallery-caption a em,.gallery-caption a strong{color:inherit}</style> <div class="post"> <header class="post-header"> <h1 class="post-title">Gallery</h1> <p class="post-description"></p> </header> <article> <div class="gallery-grid"> <figure class="gallery-item"> <div class="gallery-media"> <video controls="" autoplay="" muted="" loop="" playsinline="" preload="metadata"> <source src="/assets/video/gallery/sp-vorticity-mag-white-ppt-under30mb.mp4" type="video/mp4"></source> </video> </div> <figcaption class="gallery-caption"> Volume rendering of vorticity magnitude in incompressible turbulent channel flow at <span class="math">\(Re_b = 5150\)</span> (corresponding to <span class="math">\(Re_\tau \approx 300\)</span>). The computational domain is <span class="math">\(4\pi h \times 2h \times 2\pi h\)</span>, where <span class="math">\(h\)</span> is the channel half-height. Visualization rendered in ParaView. </figcaption> </figure> <figure class="gallery-item"> <div class="gallery-media gallery-media--45x16"> <video controls="" autoplay="" muted="" loop="" playsinline="" preload="metadata"> <source src="/assets/video/gallery/ptcl-flow-lowUf-colorbyVp-3dview-3600x1280-web.mp4" type="video/mp4"></source> </video> </div> <figcaption class="gallery-caption"> Volume rendering of vorticity magnitude in four-way coupled particle-laden turbulent channel flow at <span class="math">\(Re_b = 5150\)</span> and <span class="math">\(St^+ = 100\)</span>, a regime of pronounced drag reduction and turbulence attenuation. Only particles in low-speed fluid regions are shown, colored by their wall-normal velocity (<span class="math">\(v_p &gt; 0\)</span>, red; <span class="math">\(v_p &lt; 0\)</span>, blue), revealing the lift-up of particle streaks clustered in these regions. See <a href="https://doi.org/10.1017/jfm.2025.10340" rel="external nofollow noopener" target="_blank"><em>J. Fluid Mech.</em> <strong>1015</strong>, A55 (2025)</a> for the physical analysis. Visualization rendered in ParaView. </figcaption> </figure> </div> </article> </div> </div> <footer class="fixed-bottom" role="contentinfo"> <div class="container mt-0"> © Copyright 2026 Zi-Mo Liao. Powered by <a href="https://jekyllrb.com/" target="_blank" rel="external nofollow noopener">Jekyll</a> with <a href="https://github.com/alshedivat/al-folio" rel="external nofollow noopener" target="_blank">al-folio</a> theme. Hosted by <a href="https://pages.github.com/" target="_blank" rel="external nofollow noopener">GitHub Pages</a>. Last updated: August 25, 2026. </div> </footer> <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js" integrity="sha256-/xUj+3OJU5yExlq6GSYGSHk7tPXikynS7ogEvDej/m4=" crossorigin="anonymous"></script> <script src="/assets/js/bootstrap.bundle.min.js"></script> <script src="https://cdn.jsdelivr.net/npm/mdbootstrap@4.20.0/js/mdb.min.js" integrity="sha256-NdbiivsvWt7VYCt6hYNT3h/th9vSTL4EDWeGs5SN3DA=" crossorigin="anonymous"></script> <script defer src="https://cdn.jsdelivr.net/npm/masonry-layout@4.2.2/dist/masonry.pkgd.min.js" integrity="sha256-Nn1q/fx0H7SNLZMQ5Hw5JLaTRZp0yILA/FRexe19VdI=" crossorigin="anonymous"></script> <script defer src="https://cdn.jsdelivr.net/npm/imagesloaded@5.0.0/imagesloaded.pkgd.min.js" integrity="sha256-htrLFfZJ6v5udOG+3kNLINIKh2gvoKqwEhHYfTTMICc=" crossorigin="anonymous"></script> <script defer src="/assets/js/masonry.js?a0db7e5d5c70cc3252b3138b0c91dcaf" type="text/javascript"></script> <script defer src="https://cdn.jsdelivr.net/npm/mediu
